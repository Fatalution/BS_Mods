<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add to Encore</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: #111318; color: #e6e8ee; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
    a.button { display: inline-block; margin: 16px 0; padding: 12px 24px; border-radius: 8px;
               background: #f08c2e; color: #111318; font-weight: 600; text-decoration: none; }
    code { font-size: 13px; word-break: break-all; color: #a9b0bf; }
    a { color: #f08c2e; }
  </style>
</head>
<body>
  <main>
    <h1>Fatalution's mods</h1>
    <p>Opening Encore to add the repository...</p>
    <a class="button" id="open" href="#">Open in Encore</a>
    <p>Nothing happened? Paste this into your browser's address bar:<br><code id="link"></code></p>
    <p><a href="https://encore.scoresaber.com">What's Encore?</a> · <a href="https://github.com/Fatalution/BS_Mods">All mods</a></p>
  </main>
  <script>
    const link = "encore://add-source?url=https://raw.githubusercontent.com/Fatalution/BS_Mods/main/index.json";
    document.getElementById("open").href = link;
    document.getElementById("link").textContent = link;
    window.location.href = link;
  </script>
</body>
</html>
